[package]
name        = "loco"
version     = "1.0.0"
edition     = "2024"
description = "MCP server for local LLMs — Ollama, LM Studio, llama.cpp"
license     = "MIT"
repository  = "https://github.com/ilovepixelart/loco"
readme      = "README.md"
keywords    = ["mcp", "ollama", "lmstudio", "llm"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "loco"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive", "env"] }
reqwest            = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tokio-stream       = "0.1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
